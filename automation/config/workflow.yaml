# Workflow Configuration

# Maximum number of retry attempts per task
max_retries:
  validation: 3
  fix: 3
  review: 3
  build: 3
  # Total per task: max 12 attempts before HUMAN_DECISION_REQUIRED

# Stop conditions
stop_conditions:
  human_decision_required: true  # Hard stop
  critical_blocker: true         # Hard stop
  max_retries_exceeded: true     # Hard stop after 12 total attempts
  no_more_tasks: true            # Normal stop
  unresolved_sdk_issue: true     # Hard stop

# OpenCode invocation
# Verified OpenCode CLI 1.18.18 flags:
#   opencode run <message> [--agent <agent>] [--format json] [--auto]
#   There is NO --task, --context, or --skill flag.
opencode:
  command: "opencode"
  run_subcommand: true           # Invoke via: opencode run <message>
  agent_flag: "--agent"          # For review/implementation agents
  format_flag: "--format json"   # Machine-readable JSON output
  auto_flag: "--auto"            # Auto-approve non-denied permissions
  timeout_seconds: 600
  check_command: "Get-Command opencode"
  # If opencode is not available, the orchestrator documents CRITICAL_BLOCKER

# Validation commands
# NOTE: flutter test is used instead of dart test. dart test pulls in the
# Flutter framework and triggers Dart SDK 3.13.2 compatibility errors.
# flutter test runs the same test suite correctly.
validation:
  format: "dart format --output=none ."
  analyze: "dart analyze lib/"
  test: "flutter test"
  flutter_analyze: "flutter analyze"
  build: "flutter analyze"
  # All must pass for validation to succeed

# Review configuration
# Review decisions (machine-readable, parsed from OpenCode output):
#   REVIEW_DECISION: APPROVED
#   REVIEW_DECISION: APPROVED_WITH_FOLLOW_UP
#   REVIEW_DECISION: CHANGES_REQUIRED
#   REVIEW_DECISION: HUMAN_DECISION_REQUIRED
review:
  agent: ""                     # Default agent (implementation agent)
  decision_marker: "REVIEW_DECISION:"
  valid_decisions:
    - "APPROVED"
    - "APPROVED_WITH_FOLLOW_UP"
    - "CHANGES_REQUIRED"
    - "HUMAN_DECISION_REQUIRED"
  max_attempts: 3
  # CHANGES_REQUIRED -> send findings to OpenCode -> fix -> validate -> review again
  # HUMAN_DECISION_REQUIRED -> persist state -> generate decision report -> hard stop

# State persistence
state:
  checkpoint_file: "automation/state/checkpoint.json"
  report_dir: "automation/state/reports/"
  update_on_task_complete: true
  update_on_validation_pass: true
  schema_fields:
    - "current_sprint"
    - "current_task"
    - "task_status"
    - "completed_tasks"
    - "validation_retries"
    - "fix_retries"
    - "review_retries"
    - "last_review_decision"
    - "last_validation_result"
    - "global_retry_count"
    - "consecutive_failures"
    - "timestamp"
    - "stop_reason"
    - "human_decision_required"

# Progress documentation
progress:
  file: "docs/PROGRESS.md"
  update_on_complete: true
  update_on_stop: true

# Git configuration
git:
  commit_on_complete: true
  commit_message_format: "chore: checkpoint — <task>"
  push_on_complete: false  # Set to true if pushing is desired
  branch: "main"
  commit_unreviewed: false  # NEVER commit unreviewed work

# Safety limits
safety:
  max_tasks_per_run: 10     # Prevent runaway execution
  max_total_retries: 50     # Global retry limit
  max_consecutive_failures: 3  # Stop after 3 consecutive task failures
  require_human_approval_for_roadmap_changes: true

# Type Definitions
# Task status values
task_status:
  - IN_PROGRESS
  - COMPLETED
  - PARTIAL
  - FAILED
  - BLOCKED

# Orchestrator status values
orchestrator_status:
  - RUNNING
  - PAUSED
  - STOPPED
  - HUMAN_DECISION_REQUIRED
  - CRITICAL_BLOCKER

# Validation result values
validation_result:
  - PASS
  - FAIL
  - WARNING
  - ERROR

# Environment Checks
required_tools:
  - name: "dart"
    check: "dart --version"
    required: true
  - name: "flutter"
    check: "flutter --version"
    required: true
  - name: "opencode"
    check: "Get-Command opencode"
    required: true
  - name: "build_runner"
    check: "dart run build_runner --help"
    required: true

# Retry Policy
retry_policy:
  # Number of attempts before escalating
  validation_max: 3
  fix_max: 3
  review_max: 3
  build_max: 3

  # Backoff between retries (seconds)
  backoff_seconds: 5

  # After exhausting retries, escalate to human
  escalate_on_exhaustion: true

  # Global retry limit
  global_max_retries: 50

  # Consecutive task failure limit
  consecutive_failure_limit: 3
